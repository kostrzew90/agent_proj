services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    volumes: ["argus-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus"]
      interval: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    ports: ["8080:8080"]
  liq-listener:
    build: .
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    command: ["python", "-m", "argus.liquidations.listener"]
    restart: unless-stopped
volumes:
  argus-pg:
