# RAG na VPS (Jarvis Faza 1) — z LangFuse, bez Flower, worker x1, Ollama CPU (embeddingi)
services:
  rag-postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: ${RAG_DB_USER:-rag}
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:-ragpass}
      POSTGRES_DB: ${RAG_DB_NAME:-rag}
    volumes:
      - rag-postgres-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RAG_DB_USER:-rag} -d ${RAG_DB_NAME:-rag}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rag-redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    volumes:
      - rag-redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rag-ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    restart: unless-stopped
    volumes:
      - rag-ollama-data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 3g

  rag-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-api
    restart: unless-stopped
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:8000:8000"
    env_file:
      - .env
    environment:
      RAG_DB_HOST: rag-postgres
      RAG_DB_PORT: 5432
      REDIS_URL: redis://rag-redis:6379/0
      OLLAMA_URL: http://rag-ollama:11434
      LANGFUSE_HOST: http://rag-langfuse:3000
      LLMOPS_URL: ${LLMOPS_URL:-}
      LLMOPS_TOKEN: ${LLMOPS_TOKEN:-}
      LLMOPS_PROJECT: rag
      LLMOPS_SERVICE: chat-api
      LLMOPS_ENV: production
      LLMOPS_HOST: contabo-vps
    volumes:
      - rag-uploads:/data/uploads
      - rag-watch:/data/watch
    depends_on:
      rag-postgres:
        condition: service_healthy
      rag-redis:
        condition: service_healthy
      rag-langfuse:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  rag-warp:
    image: caomingjun/warp
    container_name: rag-warp
    restart: unless-stopped
    device_cgroup_rules:
      - 'c 10:200 rwm'
    environment:
      - WARP_SLEEP=5
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - rag-warp-data:/var/lib/cloudflare-warp

  rag-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-worker
    restart: unless-stopped
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=1 -Q default,documents,crawl
    env_file:
      - .env
    environment:
      RAG_DB_HOST: rag-postgres
      RAG_DB_PORT: 5432
      REDIS_URL: redis://rag-redis:6379/0
      OLLAMA_URL: http://rag-ollama:11434
      WHISPER_MODEL_SIZE: small
      WHISPER_THREADS: "2"
      LANGFUSE_HOST: http://rag-langfuse:3000
      YOUTUBE_COOKIES_FILE: /data/youtube-cookies.txt
      YOUTUBE_PROXY: socks5://rag-warp:1080
      LLMOPS_URL: ${LLMOPS_URL:-}
      LLMOPS_TOKEN: ${LLMOPS_TOKEN:-}
      LLMOPS_PROJECT: rag
      LLMOPS_SERVICE: worker
      LLMOPS_ENV: production
      LLMOPS_HOST: contabo-vps
    volumes:
      - rag-uploads:/data/uploads
      - rag-watch:/data/watch
      - ./youtube-cookies.txt:/data/youtube-cookies.txt:ro
    depends_on:
      rag-postgres:
        condition: service_healthy
      rag-redis:
        condition: service_healthy
      rag-langfuse:
        condition: service_started
      rag-warp:
        condition: service_started

  rag-langfuse:
    image: langfuse/langfuse:2
    container_name: rag-langfuse
    restart: unless-stopped
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:3001:3000"
    environment:
      DATABASE_URL: postgresql://${RAG_DB_USER:-rag}:${RAG_DB_PASSWORD:-ragpass}@rag-postgres:5432/${LANGFUSE_DB_NAME:-langfuse}
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-changeme-langfuse-secret}
      SALT: ${LANGFUSE_SALT:-changeme-langfuse-salt}
      TELEMETRY_ENABLED: "false"
    depends_on:
      rag-postgres:
        condition: service_healthy

  rag-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    restart: unless-stopped
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:3003:80"
    depends_on:
      rag-api:
        condition: service_healthy

volumes:
  rag-postgres-data:
  rag-redis-data:
  rag-ollama-data:
  rag-uploads:
  rag-watch:
  rag-warp-data:
