name: Pool Monitor — Basen Nieporęt

on:
  # Scheduled trigger disabled 2026-06-23 — moved to VPS crontab (~/pool-monitor on
  # Argus VPS 84.235.174.129), which runs 24/7 without GH Actions' scheduling throttle
  # (GH gave ~4.6h real avg interval vs the 15min cron here).
  workflow_dispatch: {}   # ręczne uruchomienie z UI GitHub (fallback/manual only)

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hermes/scripts/pool_monitor_requirements.txt

      - name: Install dependencies
        run: pip install -r hermes/scripts/pool_monitor_requirements.txt

      - name: Run pool monitor
        env:
          NEON_DSN: ${{ secrets.NEON_POOL_DSN }}
        run: python hermes/scripts/pool_monitor.py
